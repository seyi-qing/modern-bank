services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modernbank
      POSTGRES_PASSWORD: modernbank
      POSTGRES_DB: modernbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://modernbank:modernbank@db:5432/modernbank
      SECRET_KEY: docker-dev-secret-change-me-in-prod-32chars
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENABLE_LIVE_PAYMENTS: "false"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
